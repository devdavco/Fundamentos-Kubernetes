# 📄 Lab 2: ConfigMap montado como Archivo de Configuración (volumeMounts)
# Analogía KubeCafé: La carta impresa del día colgada en la pared de la barra Nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecafe-menu-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head><meta charset="UTF-8"><title>Menú KubeCafé (ConfigMap)</title></head>
    <body style="font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;">
      <h1>☕ Menú KubeCafé — Cargado desde ConfigMap</h1>
      <ul>
        <li>Tinto Campesino — $3.500 COP</li>
        <li>Espresso Doble — $5.000 COP</li>
        <li>Capuccino Vainilla — $7.500 COP</li>
      </ul>
      <p><i>Si editas el ConfigMap, Kubernetes actualiza este archivo automáticamente sin reconstruir la imagen.</i></p>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecafe-nginx-conf
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header X-KubeCafe-Config "ConfigMap-Nginx" always;
        }

        location /healthz {
            default_type text/plain;
            return 200 "OK - Nginx configurado desde ConfigMap\n";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-config-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-config-web
  template:
    metadata:
      labels:
        app: menu-config-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: menu-vol
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf-vol
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: menu-vol
          configMap:
            name: kubecafe-menu-html
        - name: nginx-conf-vol
          configMap:
            name: kubecafe-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: menu-config-svc
spec:
  type: NodePort
  selector:
    app: menu-config-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
