# 🔐 Lab 3: App 3 Capas con Secrets (Frontend ➔ Backend API ➔ PostgreSQL)
# Analogía KubeCafé:
# - El Secret guarda usuario/clave de la BD y la API_KEY compartida entre Frontend y Backend.
# - PostgreSQL arranca usando DB_USER/DB_PASS/POSTGRES_DB desde el Secret.
# - Frontend (Nginx) inyecta X-API-Key desde el Secret al hacer proxy al Backend.
# - Backend (Python) valida X-API-Key contra el Secret montado (readOnly) y verifica la BD.
apiVersion: v1
kind: Secret
metadata:
  name: kubecafe-receta-secreta
type: Opaque
stringData:
  DB_USER: "barista_admin"
  DB_PASS: "TintoSeguro2026!"
  POSTGRES_DB: "kubecafe"
  API_KEY: "kc-live-987654321"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-secret-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head><meta charset="UTF-8"><title>KubeCafé — Conexión con Secret</title></head>
    <body style="font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:2rem;">
      <h1>🔐 KubeCafé — Frontend ➔ Backend ➔ PostgreSQL</h1>
      <p>El Frontend reenvía <code>X-API-Key</code> desde el <b>Secret</b> hacia el Backend:</p>
      <pre id="out" style="background:#1e293b;padding:1rem;border-radius:8px;">Consultando /api/status...</pre>
      <script>
        fetch('/api/status')
          .then(r => r.json())
          .then(d => document.getElementById('out').textContent = JSON.stringify(d, null, 2))
          .catch(e => document.getElementById('out').textContent = 'Error: ' + e);
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-template
data:
  default.conf.template: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://backend-api-svc:5000/;
            proxy_set_header X-API-Key ${API_KEY};
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-postgres
  template:
    metadata:
      labels:
        app: db-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: DB_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: db-postgres-svc
spec:
  type: ClusterIP
  selector:
    app: db-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          ports:
            - containerPort: 5000
          command:
            - python3
            - -c
            - |
              import json, os, socket
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      with open('/etc/kubecafe/API_KEY') as f:
                          expected_key = f.read().strip()
                      if self.headers.get('X-API-Key') != expected_key:
                          self.send_response(401)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({"error": "Unauthorized: X-API-Key invalida o ausente"}).encode())
                          return
                      try:
                          with socket.create_connection(("db-postgres-svc", 5432), timeout=2):
                              db_status = "db-postgres-svc:5432 CONECTADA"
                      except Exception as exc:
                          db_status = f"error: {exc}"
                      payload = {
                          "status": "ok",
                          "auth": "API_KEY del Secret validada",
                          "db": db_status,
                          "db_user": os.environ.get("DB_USER", ""),
                          "db_name": os.environ.get("POSTGRES_DB", "")
                      }
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps(payload).encode())

              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: DB_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: POSTGRES_DB
          volumeMounts:
            - name: secreto-vol
              mountPath: /etc/kubecafe
              readOnly: true
      volumes:
        - name: secreto-vol
          secret:
            secretName: kubecafe-receta-secreta
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-svc
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-secret-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-secret-web
  template:
    metadata:
      labels:
        app: frontend-secret-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubecafe-receta-secreta
                  key: API_KEY
          volumeMounts:
            - name: html-vol
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-tpl-vol
              mountPath: /etc/nginx/templates
              readOnly: true
      volumes:
        - name: html-vol
          configMap:
            name: frontend-secret-html
        - name: nginx-tpl-vol
          configMap:
            name: frontend-nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-secret-svc
spec:
  type: NodePort
  selector:
    app: frontend-secret-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
