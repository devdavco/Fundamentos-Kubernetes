apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reto-01
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: reto-01
  template:
    metadata:
      labels:
        app: reto-01
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
