# ==============================================================================
# 💥 RETO ROTO 02: TargetPort Incorrecto (Connection Refused)
# Síntoma: El Service SÍ tiene Endpoints, pero al hacer `curl http://caja-svc`
#          el tráfico llega a un puerto donde Nginx no está escuchando.
# Objetivo: Corrige el `targetPort` del Service para que coincida con el contenedor.
# ==============================================================================

# Solución del reto 02 (Andrea)
#
# Fallo original: el Service caja-svc reenviaba el tráfico al targetPort 9090,
# pero el contenedor de nginx escucha en el puerto 80 (containerPort: 80).
# El Service sí encontraba al pod (tenía Endpoints), pero le mandaba el tráfico
# a un puerto donde nada escuchaba.
#
# Cómo lo descubrí: 'kubectl get endpoints caja-svc' mostró 10.244.0.183:9090,
# la IP correcta del pod pero con el puerto 9090. 'kubectl describe svc
# caja-svc' confirmó TargetPort: 9090, y el containerPort del Deployment
# decía 80. Un pod temporal con 'wget http://caja-svc' dio Connection refused.
#
# Ajuste: cambié el targetPort del Service a 80 para que coincida con el
# containerPort. No toqué el 'port' del Service (80) ni el Deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-caja
  labels:
    app: kubecafe-caja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecafe-caja
  template:
    metadata:
      labels:
        app: kubecafe-caja
    spec:
      containers:
        - name: caja
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: caja-svc
spec:
  type: ClusterIP
  selector:
    app: kubecafe-caja
  ports:
    - port: 80
      targetPort: 80
