# ==============================================================================
# 💥 RETO ROTO 04: HTTPRoute Desconectado del Gateway y Backend
# Síntoma: La ruta `kubecafe-api-route` queda en estado `Accepted: False` o no enruta,
#          porque apunta a un Gateway inexistente (`gateway-fantasma`) y a un puerto
#          equivocado (`8080`) en `cocina-svc`.
# Objetivo: Conecta el HTTPRoute al Gateway `kubecafe-gateway` y al backend `cocina-svc`
#           en el puerto correcto (`80`).
# ==============================================================================

# Solución del reto 04 (Andrea)
#
# Fallo original: el HTTPRoute tenía dos errores. En parentRefs apuntaba al
# Gateway gateway-fantasma, que no existe (el Gateway se llama
# kubecafe-gateway), y en backendRefs mandaba el tráfico al puerto 8080 de
# cocina-svc, cuando el Service escucha en el puerto 80.
#
# Cómo lo descubrí: 'kubectl describe httproute kubecafe-api-route' mostró
# Parent Refs: gateway-fantasma y Backend Refs: cocina-svc con Port: 8080, y
# 'kubectl get gateway' no mostraba ningún Gateway con ese nombre. Mientras el
# Gateway no existía, el HTTPRoute no tenía condiciones de estado.
#
# Ajuste: cambié parentRefs a kubecafe-gateway y el puerto del backend a 80.
# El Gateway y cocina-svc no forman parte de este archivo; para probar la
# solución los creé aparte desde los ejemplos de la semana.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecafe-api-route
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: cocina-svc
          port: 80
