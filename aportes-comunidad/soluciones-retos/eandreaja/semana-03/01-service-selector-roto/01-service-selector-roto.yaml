# ==============================================================================
# 💥 RETO ROTO 01: Service sin Endpoints (Selector Mismatch)
# Síntoma: El Service se crea sin errores, pero al consultar `kubectl get endpoints barra-svc`
#          aparece `<none>` y las peticiones fallan con timeout / connection refused.
# Objetivo: Haz que `barra-svc` descubra correctamente los Pods de `kubecafe-barra`.
# ==============================================================================

# Solución del reto 01 (Andrea)
#
# Fallo original: el Service barra-svc buscaba pods con el selector
# app: barra-equivocada, pero los pods del Deployment llevan la etiqueta
# app: kubecafe-barra. Como ningún pod cumplía el selector, el Service no
# tenía a quién enviar el tráfico y sus Endpoints salían vacíos.
#
# Cómo lo descubrí: 'kubectl get endpoints barra-svc' mostró <none> aunque
# los 2 pods estaban Running. 'kubectl get svc barra-svc -o wide' mostró el
# selector (app=barra-equivocada) y 'kubectl get pods --show-labels' mostró
# las etiquetas reales de los pods (app=kubecafe-barra).
#
# Ajuste: cambié el selector del Service para que sea app: kubecafe-barra.
# No toqué los pods ni el Deployment, porque sus etiquetas ya eran las
# correctas; el valor equivocado estaba solo en el Service.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-barra
  labels:
    app: kubecafe-barra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecafe-barra
  template:
    metadata:
      labels:
        app: kubecafe-barra
    spec:
      containers:
        - name: barra
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: barra-svc
spec:
  type: ClusterIP
  selector:
    app: kubecafe-barra
  ports:
    - port: 80
      targetPort: 80
