name: 🤖 Validar PR de Estudiante (Feedback y Protección)

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validar-pr:
    name: Validar retos y archivos del PR
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar rama base confiable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.base_ref }}

      - name: 🔍 Verificar archivos modificados y evaluar retos
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {
              INSTRUCTORS,
              CHALLENGE_VALIDATORS,
              discoverOfficialChallenges,
              evaluateUserProgress
            } = require('./scripts/generar-asistentes.js');

            const pr = context.payload.pull_request;
            const prUser = pr.user.login;
            const isInstructor = INSTRUCTORS.map(u => u.toLowerCase()).includes(prUser.toLowerCase());
            const allowedPrefix = `aportes-comunidad/soluciones-retos/${prUser.toLowerCase()}/`;

            // 1. Listar todos los archivos cambiados en el PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const forbiddenFiles = [];
            const studentFiles = [];

            for (const f of files) {
              const lower = f.filename.toLowerCase();
              if (lower.startsWith(allowedPrefix)) {
                studentFiles.push(f);
              } else if (!isInstructor) {
                forbiddenFiles.push(f.filename);
              }
            }

            // 2. Descargar al workspace solo las soluciones del estudiante (sin ejecutar código del fork)
            for (const f of studentFiles) {
              if (f.status === 'removed') continue;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: pr.head.repo.owner.login,
                  repo: pr.head.repo.name,
                  path: f.filename,
                  ref: pr.head.sha
                });
                if (data && data.content) {
                  const dest = path.join(process.cwd(), f.filename);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });
                  fs.writeFileSync(dest, Buffer.from(data.content, 'base64').toString('utf8'));
                }
              } catch (err) {
                console.log(`No se pudo descargar ${f.filename}:`, err.message);
              }
            }

            // 3. Evaluar progreso con las reglas oficiales
            const official = discoverOfficialChallenges();
            const result = evaluateUserProgress(prUser, official);

            // 4. Construir comentario claro para el estudiante
            const marker = '<!-- BOT_VALIDACION_PR -->';
            let body = `${marker}\n## 🤖 Reporte Automático de Validación — @${prUser}\n\n`;

            if (forbiddenFiles.length > 0) {
              body += `### ⛔ Archivos protegidos modificados (causan conflictos de merge)\n`;
              body += `Tu Pull Request solo debe modificar archivos dentro de \`aportes-comunidad/soluciones-retos/${prUser}/\`.\n`;
              body += `Por favor revierte estos archivos (el bot los actualiza automáticamente después del merge):\n\n`;
              for (const ff of forbiddenFiles) {
                body += `- ❌ \`${ff}\`\n`;
              }
              body += `\n**Cómo limpiarlo en 3 comandos:**\n\`\`\`bash\ngit fetch origin\ngit checkout origin/main -- ${forbiddenFiles.join(' ')}\ngit commit -m "chore: revertir archivos protegidos" && git push\n\`\`\`\n\n---\n\n`;
            } else {
              body += `✅ **Archivos permitidos:** Solo modificaste tu carpeta personal (sin conflictos en \`ASISTENTES.md\`, \`README.md\` ni \`asistentes.json\`).\n\n`;
            }

            body += `### 📊 Evaluación de Retos Detectados\n`;
            const touchedWeeks = new Set();
            for (const f of studentFiles) {
              const m = f.filename.match(/\/(semana-\d+)\//i);
              if (m) touchedWeeks.add(m[1].toLowerCase());
            }

            const relevantWeeks = (result.detailedReport || []).filter(
              r => touchedWeeks.has(r.weekKey) || r.solvedCount > 0 || r.hasBitacora
            );

            if (relevantWeeks.length > 0) {
              for (const r of relevantWeeks) {
                const icon = r.isComplete ? '✅' : '⏳';
                const bitacoraTxt = r.hasBitacora ? ' • 📔 Bitácora OK' : '';
                body += `\n#### 📂 \`${r.weekKey}\` (${r.solvedCount}/${r.totalExpected} ${icon}${bitacoraTxt})\n\n`;
                body += `| Ejercicio | Estado |\n| :--- | :---: |\n`;
                const validators = CHALLENGE_VALIDATORS[r.weekKey];
                if (validators) {
                  for (const v of validators) {
                    const ok = r.solvedNums.includes(v.id);
                    body += `| \`${v.name}\` | ${ok ? '✅ OK' : '❌ FAIL'} |\n`;
                  }
                } else {
                  for (const num of official[r.weekKey] || []) {
                    const ok = r.solvedNums.includes(num);
                    body += `| Reto \`${num}\` | ${ok ? '✅ OK' : '❌ FAIL'} |\n`;
                  }
                }
              }
              body += `\n**Progreso estimado tras este PR:** ${result.rango} · **${result.points} XP**\n`;
            } else {
              body += `⚠️ No se detectaron archivos válidos en \`aportes-comunidad/soluciones-retos/${prUser}/semana-XX/\`.\n`;
            }

            // Guardar reporte para que el workflow comentar-pr-estudiante lo publique de forma segura
            fs.mkdirSync('/tmp/pr-report', { recursive: true });
            fs.writeFileSync('/tmp/pr-report/report.json', JSON.stringify({ prNumber: pr.number, body }));

            if (forbiddenFiles.length > 0) {
              core.setFailed(`El PR modifica archivos protegidos fuera de aportes-comunidad/soluciones-retos/${prUser}/: ${forbiddenFiles.join(', ')}`);
            }

      - name: 📤 Subir reporte de validación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-validation-report
          path: /tmp/pr-report/report.json
          retention-days: 1
