name: 💬 Publicar Comentario de Validación en PR

on:
  workflow_run:
    workflows: ["🤖 Validar PR de Estudiante (Feedback y Protección)"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comentar-pr:
    name: Publicar reporte en el PR
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Descargar reporte de validación
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-validation-report
          path: /tmp/pr-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 💬 Publicar o actualizar comentario en el PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/pr-report/report.json';
            if (!fs.existsSync(reportPath)) {
              console.log('No se encontró report.json; omitiendo comentario.');
              return;
            }
            const { prNumber, body } = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const marker = '<!-- BOT_VALIDACION_PR -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
