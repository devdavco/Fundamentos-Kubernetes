# 💥 Reto 02: Contenedor muere con OOMKilled (Exit Code 137)
# Objetivo: El proceso necesita ~24Mi de memoria, pero el límite es demasiado bajo (8Mi).
# Pista: Revisa 'kubectl describe pod reto-02-oom' y sube limits.memory (y requests.memory) a al menos 64Mi.
apiVersion: v1
kind: Pod
metadata:
  name: reto-02-oom
spec:
  containers:
    - name: app
      image: python:3.12-alpine
      command:
        - python3
        - -c
        - |
          import time
          data = "A" * (24 * 1024 * 1024)
          print("Memoria asignada correctamente:", len(data))
          time.sleep(3600)
      resources:
        requests:
          memory: "8Mi"
          cpu: "50m"
        limits:
          memory: "8Mi"
          cpu: "100m"
