# 🪪 Lab 5: Control de Acceso RBAC (ServiceAccount + Role + RoleBinding)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: barista-readonly
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lector-pods-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: asignar-lector-pods
  namespace: default
subjects:
  - kind: ServiceAccount
    name: barista-readonly
    namespace: default
roleRef:
  kind: Role
  name: lector-pods-role
  apiGroup: rbac.authorization.k8s.io
