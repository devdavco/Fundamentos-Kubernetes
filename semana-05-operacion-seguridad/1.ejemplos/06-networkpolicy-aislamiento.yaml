# 🧱 Lab 6: Aislamiento de Red Pod-a-Pod con NetworkPolicy
apiVersion: v1
kind: Pod
metadata:
  name: bd-secreta
  labels:
    app: bd-secreta
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bd-secreta-svc
spec:
  selector:
    app: bd-secreta
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-backend-a-bd
spec:
  podSelector:
    matchLabels:
      app: bd-secreta
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              rol: backend
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: app-autorizada
  labels:
    rol: backend
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: app-intrusa
  labels:
    rol: externo
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
